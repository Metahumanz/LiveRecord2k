name: Package checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/**'
      - 'scripts/build-linux.cjs'
      - 'scripts/build-msix.cjs'
      - 'scripts/linux-package.test.cjs'
      - 'scripts/msix-package.test.cjs'
      - 'package.json'
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/build-linux.cjs'
      - 'scripts/build-msix.cjs'
      - 'scripts/linux-package.test.cjs'
      - 'scripts/msix-package.test.cjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  package:
    name: Package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run package tests
        run: npm run test:package
