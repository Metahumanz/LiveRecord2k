name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        run: |
          $mingwPath = "C:\msys64\mingw64\bin"
          $env:Path = "$mingwPath;$env:Path"
          $mingwPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version
          windres --version

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate Update Manifest
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $zipPath = "release\bili-record-2k-webui.zip"
          $sha256 = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/bili-record-2k-webui.zip"
          $manifest = [ordered]@{
            name = "BiliRecord2K"
            version = $version
            tagName = $tag
            packageUrl = $packageUrl
            sha256 = $sha256
            releasedAt = (Get-Date).ToUniversalTime().ToString("o")
            files = @(
              [ordered]@{
                name = "bili-record-2k-webui.zip"
                url = $packageUrl
                sha256 = $sha256
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path "release\update.json" -Encoding UTF8
          Get-Content "release\update.json"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-record-2k-webui-${{ github.ref_name }}
          path: |
            release/bili-record-2k-webui.zip
            release/update.json
            release/webui/BiliRecord2K.exe
            release/webui/BiliRecord2K.Service.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "BiliRecord2K $tag"
          $notes = @"
          自动构建的 Windows WebUI 发布包。

          - `bili-record-2k-webui.zip`：完整运行包
          - `BiliRecord2K.exe`：托盘启动器
          - `BiliRecord2K.Service.exe`：后台服务
          - `update.json`：热更新检测 manifest
          "@
          $assets = @(
            "release\bili-record-2k-webui.zip",
            "release\update.json",
            "release\webui\BiliRecord2K.exe",
            "release\webui\BiliRecord2K.Service.exe"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title $title --notes $notes
          }
