name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的标签，例如 v0.0.2。留空时仅适合由 v* tag 自动触发。'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        run: |
          $mingwPath = "C:\msys64\mingw64\bin"
          $env:Path = "$mingwPath;$env:Path"
          $mingwPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version
          windres --version

      - name: Setup NSIS
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "C:\Program Files (x86)\NSIS"
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          makensis /VERSION

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          BUILD_INSTALLER_REQUIRED: '1'
        run: npm run build

      - name: Generate Update Manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tag = "$env:RELEASE_TAG".Trim()
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with v, for example v0.0.2."
          }
          $version = $tag -replace '^v', ''
          $zipPath = "release\bili-record-2k-webui.zip"
          $setupPath = "release\bili-record-2k-setup.exe"
          $zipSha256 = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSha256 = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/bili-record-2k-webui.zip"
          $setupUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/bili-record-2k-setup.exe"
          $manifest = [ordered]@{
            name = "BiliRecord2K"
            version = $version
            tagName = $tag
            packageType = "installer"
            packageUrl = $setupUrl
            sha256 = $setupSha256
            installerUrl = $setupUrl
            installerSha256 = $setupSha256
            portableUrl = $zipUrl
            portableSha256 = $zipSha256
            releasedAt = (Get-Date).ToUniversalTime().ToString("o")
            files = @(
              [ordered]@{
                name = "bili-record-2k-setup.exe"
                kind = "installer"
                url = $setupUrl
                sha256 = $setupSha256
              },
              [ordered]@{
                name = "bili-record-2k-webui.zip"
                kind = "portable"
                url = $zipUrl
                sha256 = $zipSha256
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path "release\update.json" -Encoding UTF8
          Get-Content "release\update.json"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-record-2k-webui-${{ inputs.release_tag || github.ref_name }}
          path: |
            release/bili-record-2k-setup.exe
            release/bili-record-2k-webui.zip
            release/update.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tag = "$env:RELEASE_TAG".Trim()
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with v, for example v0.0.2."
          }
          $title = "BiliRecord2K $tag"
          $notes = @(
            '自动构建的 Windows WebUI 发布包。',
            '',
            '- bili-record-2k-setup.exe：Windows 安装器，应用内更新会下载并启动它',
            '- bili-record-2k-webui.zip：完整运行包',
            '- update.json：热更新检测 manifest'
          ) -join [Environment]::NewLine
          $assets = @(
            "release\bili-record-2k-setup.exe",
            "release\bili-record-2k-webui.zip",
            "release\update.json"
          )
          $releaseExists = $false
          try {
            gh release view $tag *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          } catch {
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title $title --notes $notes
          }
