name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的标签，例如 v0.2.8。'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and media smoke check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        # FFmpeg fixture tests are CPU-intensive. Running their files in
        # parallel on a two-core hosted runner can make an individual media
        # test exceed its own process timeout and leave the release blocked.
        timeout-minutes: 15
        run: node --test --test-concurrency=1 --test-force-exit scripts/*.test.cjs

      - name: Type-check and build frontend
        run: |
          npx tsc --noEmit
          npx vite build

      - name: Run FFmpeg smoke test
        run: node scripts/smoke-test.cjs

  build-windows:
    name: Build Windows packages
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        run: |
          $mingwPath = "C:\msys64\mingw64\bin"
          $mingwPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$mingwPath;$env:Path"
          gcc --version
          windres --version

      - name: Setup NSIS
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "C:\Program Files (x86)\NSIS"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$nsisPath;$env:Path"
          makensis /VERSION

      - name: Install dependencies
        run: npm ci

      - name: Run Windows regression tests
        timeout-minutes: 15
        run: node --test --test-concurrency=1 --test-force-exit scripts/*.test.cjs

      - name: Build Windows packages
        env:
          BUILD_INSTALLER_REQUIRED: '1'
          BUILD_NO_OPEN: '1'
        run: npm run build

      - name: Validate MSIX package layout
        env:
          BUILD_NO_OPEN: '1'
        run: npm run build:msix -- --skip-webui-build --allow-unsigned --skip-appinstaller --output-dir build\msix-smoke

      - name: Build signed MSIX and App Installer feed
        if: ${{ vars.MSIX_FEED_BASE_URL != '' && vars.MSIX_PUBLISHER != '' }}
        env:
          BUILD_NO_OPEN: '1'
          MSIX_FEED_BASE_URL: ${{ vars.MSIX_FEED_BASE_URL }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_SIGNING_CERT_PFX_B64: ${{ secrets.MSIX_SIGNING_CERT_PFX_B64 }}
          MSIX_SIGNING_CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
          MSIX_TIMESTAMP_URL: ${{ vars.MSIX_TIMESTAMP_URL }}
        run: npm run build:msix -- --skip-webui-build

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/bili-record-2k-setup.exe
            release/bili-record-2k-webui.zip
            release/*.msix
            release/*.appinstaller
          if-no-files-found: error

      - name: Upload MSIX feed payload
        if: ${{ vars.MSIX_FEED_BASE_URL != '' && vars.MSIX_PUBLISHER != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: msix-feed
          path: |
            release/*.msix
            release/*.appinstaller
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.arch }} packages
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Linux regression tests
        timeout-minutes: 15
        run: node --test --test-concurrency=1 --test-force-exit scripts/*.test.cjs

      - name: Build Linux packages
        run: npm run build:linux

      - name: Validate Linux packages
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find release -maxdepth 1 -name 'bili-record-2k_*_${{ matrix.deb_arch }}.deb' -print -quit)
          tarball=$(find release -maxdepth 1 -name 'bili-record-2k_*_linux_${{ matrix.arch }}.tar.gz' -print -quit)
          test -n "$deb"
          test -n "$tarball"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          tar -tzf "$tarball"
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          dpkg-deb --extract "$deb" "$temp_dir"
          for script in packaging/linux/*.sh packaging/linux/postinst packaging/linux/prerm packaging/linux/postrm; do
            sh -n "$script"
          done
          "$temp_dir/usr/lib/bili-record-2k/bin/node" --check "$temp_dir/usr/lib/bili-record-2k/server.bundle.cjs"
          "$temp_dir/usr/lib/bili-record-2k/bin/node" --check "$temp_dir/usr/lib/bili-record-2k/linux-update.cjs"
          unit_output=$(systemd-analyze verify "$temp_dir"/usr/lib/systemd/system/*.service "$temp_dir"/usr/lib/systemd/system/*.path 2>&1 || true)
          echo "$unit_output"
          if grep -Eiq 'unknown lvalue|failed to parse|bad unit file setting' <<<"$unit_output"; then
            exit 1
          fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*_linux_*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate platform-aware update manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          cp scripts/install-linux.sh release/install-linux.sh
          node scripts/generate-update-manifest.cjs "$RELEASE_TAG"

      - name: Verify signed update manifest and architecture coverage
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 3 and
            .signatureAlgorithm == "ed25519" and
            ([.signed.files[] | select(.platform == "linux" and .arch == "x64") | .kind] | sort | unique) == ["deb", "tarball"] and
            ([.signed.files[] | select(.platform == "linux" and .arch == "arm64") | .kind] | sort | unique) == ["deb", "tarball"]
          ' release/update.json >/dev/null
          jq -j -cS '.signed' release/update.json > release/update-signed.json
          jq -r '.signature' release/update.json | openssl base64 -d -A > release/update-signature.bin
          openssl pkeyutl -verify -pubin -inkey packaging/linux/update-public-key.pem -rawin \
            -in release/update-signed.json -sigfile release/update-signature.bin
          rm release/update-signed.json release/update-signature.bin

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-record-2k-${{ inputs.release_tag || github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag=${RELEASE_TAG//[[:space:]]/}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          title="BiliRecord2K $tag"
          notes_file="$RUNNER_TEMP/release-notes.md"
          node scripts/generate-release-notes.cjs "$tag" > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" release/* --verify-tag --title "$title" --notes-file "$notes_file"
          fi
